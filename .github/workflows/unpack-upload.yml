# Entpackt hochgeladene Projekt-ZIPs (Dateiname ll-upload*.zip) ins Repo,
# loescht die ZIP und veroeffentlicht die Website danach neu.
name: Projekt-Upload entpacken

on:
  push:
    branches: [main]
    paths: ['ll-upload*.zip']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZIP entpacken und entfernen
        id: unpack
        run: |
          set -e
          shopt -s nullglob
          zips=(ll-upload*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "Keine ZIP gefunden."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for z in "${zips[@]}"; do
            if unzip -Z1 "$z" | grep -Ev '^(app|components|lib|public)/' | grep -q .; then
              echo "Unerwartete Pfade in $z" && exit 1
            fi
            unzip -o -q "$z"
            git rm -q "$z"
          done
          git add -A app components lib public
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Unpack project upload"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Website neu veroeffentlichen
        if: steps.unpack.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main --repo "${{ github.repository }}"
