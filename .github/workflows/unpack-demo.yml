name: Architektur-Demo entpacken (einmalig)

on:
  push:
    branches: [main]
    paths: ['ll-architektur-demo*.zip', '.github/workflows/unpack-demo.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZIP entpacken und entfernen
        run: |
          set -e
          shopt -s nullglob
          zips=(ll-architektur-demo*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "Keine ZIP gefunden, nichts zu tun."
            exit 0
          fi
          for z in "${zips[@]}"; do
            unzip -o -q "$z"
            git rm -q "$z"
          done
          git add -A app components public README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add architecture concept demo (ChatGPT project) to Ideas become Identity"
          git push
