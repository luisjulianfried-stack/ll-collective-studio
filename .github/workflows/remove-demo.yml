name: Falsche Architektur-Demo entfernen (einmalig)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-demo.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Demo entfernen und Dateien auf Stand 952c837 zuruecksetzen
        run: |
          set -e
          if [ ! -d public/showcase ] && [ ! -f components/architecture-demo.tsx ]; then
            echo "Demo bereits entfernt, nichts zu tun."
            exit 0
          fi
          git rm -r -q --ignore-unmatch public/showcase components/architecture-demo.tsx
          git checkout 952c837 -- app/globals.css components/project-gallery.tsx README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove architecture demo (wrong website)"
          git push
