name: Unpack uploaded ZIPs (einmalig)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/unpack-uploads.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZIPs entpacken und entfernen
        run: |
          set -e
          if [ ! -f ll-architektur-teil1.zip ] && [ ! -f ll-architektur-teil2.zip ]; then
            echo "Keine ZIPs gefunden, nichts zu tun."
            exit 0
          fi
          for z in ll-architektur-teil1.zip ll-architektur-teil2.zip; do
            unzip -o -q "$z"
            git rm -q "$z"
          done
          git add -A app components public README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add architecture website concept demo to Ideas become Identity"
          git push
